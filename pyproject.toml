[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cad-designer"
version = "0.2.0"
description = "Open-source parametric AI industrial design workflow for 3D printing"
requires-python = ">=3.12,<3.13"

[project.scripts]
ai-cad = "ai_cad_designer.cli:main"
ai-cad-gui = "ai_cad_designer.gui_server:main"

[tool.setuptools.packages.find]
include = ["ai_cad_designer*"]

[tool.setuptools.package-data]
ai_cad_designer = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
